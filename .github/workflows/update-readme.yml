name: Update README

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - projects.json
      - projects.schema.json
      - Cargo.toml
      - Cargo.lock
      - src/**
      - README.template.md
      - assets/**
      - .github/actions/awesome/**
      - .github/workflows/update-readme.yml

permissions:
  contents: write

# A newer trigger supersedes older generation, including the debounce delay.
concurrency:
  group: update-readme
  cancel-in-progress: true

jobs:
  update-readme:
    # Forks maintain project data only; README publication belongs to upstream.
    if: github.repository == 'neiii/awesome-rune'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for more merges
        if: github.event_name == 'push'
        run: sleep 60

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up awesome
        uses: ./.github/actions/awesome

      - name: Generate and publish README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Charts change every day, so they live on an orphan `assets` branch that is replaced
          # wholesale instead of accumulating history on main. Publish them before the README
          # that links them; chart URLs carry a content hash, so an unchanged README means
          # unchanged charts.
          publish_charts() {
            rm -rf build/assets-branch
            mkdir -p build/assets-branch/charts
            cp build/charts/*.png build/assets-branch/charts/
            git -C build/assets-branch init --quiet --initial-branch=assets
            git -C build/assets-branch add --all
            git -C build/assets-branch commit --quiet -m "Activity charts"
            git -C build/assets-branch push --quiet --force \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" assets
          }
          for attempt in 1 2 3; do
            git fetch origin main
            # This disposable runner owns its checkout. Discard any stale generated
            # commit and regenerate instead of rebasing generated Markdown.
            git reset --hard origin/main
            base=$(git rev-parse HEAD)
            awesome validate
            awesome readme
            if git diff --quiet -- README.md; then
              echo "README.md is already current."
              exit 0
            fi
            publish_charts
            git add README.md
            git commit -m "Update README.md"
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$base" ]; then
              echo "::error::Push failed without main advancing; not retrying."
              exit 1
            fi
            echo "main advanced during generation (attempt $attempt of 3)."
          done
          echo "::error::main kept advancing; README update exhausted three attempts."
          exit 1
