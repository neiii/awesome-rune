name: Validate

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - projects.json
      - projects.schema.json
      - ignored.json
      - ignored.schema.json
      - Cargo.toml
      - Cargo.lock
      - src/**
      - .github/workflows/validate.yml

permissions:
  contents: read

jobs:
  projects:
    name: Validate projects.json
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure README is not modified
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- README.md; then
            echo "::error::README.md is generated. Pull Requests should only edit \`projects.json\`."
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the build
        uses: Swatinem/rust-cache@v2

      - name: Validate projects.json and ignored.json
        run: cargo run --release --quiet -- validate

      - name: Check project ordering
        run: cargo run --release --quiet -- sort --check
