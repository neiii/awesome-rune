[package]
name = "awesome-rune"
version = "0.1.0"
edition = "2021"
publish = false
license = "CC0-1.0"
description = "Maintains awesome-rune: generates the README and its charts, sorts and validates the project list, and discovers new Rune projects."

[[bin]]
name = "awesome"
path = "src/main.rs"

[workspace]
exclude = ["tools/badges/vendor"]

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dotenvy = "0.15"
jsonschema = "0.60.2"
png = "0.17"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "2"
